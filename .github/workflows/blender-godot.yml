name: Blender Godot Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'godot/**', 'tools/**', '.github/workflows/blender-godot.yml' ]
jobs:
  build-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Generate exact 3D assets
        run: blender -b --python tools/generate_assets.py
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import generated GLB
        run: godot --headless --editor --path godot --quit-after 30
      - name: Export Android prototype
        run: mkdir -p build && godot --headless --path godot --export-debug Android ../build/ORACLE-SPHERE-v0.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-sphere-v0.4-blender-godot
          path: build/ORACLE-SPHERE-v0.4.apk
