name: Blender Godot Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'godot/**', 'tools/**', '.github/workflows/blender-godot.yml' ]
jobs:
  build-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Generate exact 3D assets
        run: blender -b --python tools/generate_assets.py && test -s godot/assets/oracle_models.glb
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Configure Android exporter
        run: |
          mkdir -p ~/.config/godot ~/.android
          cp godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.tres
          sed -i "s|__JAVA_HOME__|$JAVA_HOME|" ~/.config/godot/editor_settings-4.tres
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          timeout 20s godot --headless --editor --path godot --script res://configure_android.gd || true
      - name: Import generated GLB
        run: godot --headless --editor --path godot --quit-after 30
      - name: Export Android prototype
        run: mkdir -p build && godot --headless --path godot --export-debug Android ../build/ORACLE-SPHERE-v0.4.apk
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-sphere-v0.4-blender-godot
          path: build/ORACLE-SPHERE-v0.4.apk
